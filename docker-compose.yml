services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: comet
      POSTGRES_PASSWORD: comet
      POSTGRES_DB: comet_tracker
    ports:
      - "5432:5432"
    volumes:
      - comet-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comet -d comet_tracker"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  comet-db:
